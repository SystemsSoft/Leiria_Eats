#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
# org.gradle.java.home nao deve ser fixado aqui pois e especifico de cada maquina/SO.
# Configure o JDK 17 no gradle.properties local do usuario (~/.gradle/gradle.properties)
# ou via variavel de ambiente JAVA_HOME.
# Specify Java toolchain version compatible with Gradle 8.14.5 and JVM 25
org.gradle.java.installations.auto-detect=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true